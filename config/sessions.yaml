# Escenarios del evento. Cada uno es un worker independiente.
event: Nerdearla 2026
# Idiomas de salida. La vista de audiencia ofrece además el "original" de cada tramo.
languages: [es, en, pt]
# gemini-live (interpretación simultánea con la Live API, por defecto), gemini (por tramos),
# local (faster-whisper + Gemma por Ollama) o fake (pruebas sin modelo)
engine: gemini-live
data_dir: data

sessions:
  - id: sala-a
    name: "Building Multilingual Conversational AI Agents"
    speaker: Thor Schaeff
    topic: Voice AI agents, speech-to-text, text-to-speech, LLMs, multilingual
    source: samples/thor-schaeff-multilingual-agents-en.mp3
    language: en
    loop: true
    # "Término = alias, alias": las formas que suele escribir el reconocedor se corrigen a la canónica.
    glossary: ["ElevenLabs = 11 labs, Eleven Laps", Thor Schaeff, Gemini]

  - id: sala-b
    name: "Programming is dead. Long live programming!"
    speaker: Miguel Ángel Durán (midudev)
    topic: Programación con IA, agentes, desarrollo web
    source: samples/midudev-programming-is-dead-es.mp3
    language: es
    loop: true
    glossary: [midudev, JavaScript, Cursor, Claude Code]

  - id: sala-c
    name: "Tu audio: subí un archivo o usá el micrófono"
    topic: Sala de prueba que recibe audio desde el navegador
    # Se transmite desde /enviar/sala-c (micrófono o archivo). La sesión Live se abre recién cuando
    # llega audio, así que mientras nadie la usa no cuesta nada.
    source: browser
    language: auto

  # Más ejemplos de fuentes (descomentar y ajustar):
