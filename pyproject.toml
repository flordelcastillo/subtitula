[project]
name = "subtitula"
version = "0.1.0"
description = "Subtítulos y traducción simultánea en vivo, open source, para conferencias con muchos escenarios."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "google-genai>=1.0",
  "numpy>=1.26",
  "pyyaml>=6",
  "httpx>=0.27",
  "segno>=1.6",
]

[project.optional-dependencies]
local = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
subtitula = "subtitula.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["subtitula*"]

[tool.setuptools.package-data]
subtitula = ["web/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
