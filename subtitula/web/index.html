<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121a30">
<title>Subtítulos en vivo · Live captions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/web/style.css">
<style>
  body { display: flex; flex-direction: column; min-height: 100dvh; }

  /* Selector de sala */
  .pick { max-width: 44rem; margin: 0 auto; padding: 3rem 1rem 4rem; width: 100%; }
  .pick h1 { font-size: var(--t-display); line-height: 1.05; margin: 0 0 .6rem; }
  .pick p.lead { color: var(--fg-2); margin: 0 0 var(--s-6); max-width: 34rem; }
  .rooms { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .rooms li { border-bottom: 1px solid var(--line); }
  .rooms a { display: grid; grid-template-columns: auto 1fr; gap: .2rem 1rem; padding: 1.1rem .75rem; margin: 0 -.75rem; text-decoration: none;
    border-radius: var(--r-card); transition: background-color .15s var(--ease); }
  .rooms a:hover, .rooms a:focus-visible { background: var(--tint); }
  .rooms a:active { background: color-mix(in srgb, var(--stage) 22%, transparent); }
  .rooms .dot { margin-top: .55rem; }
  .room-name { font-size: var(--t-lg); font-weight: 700; line-height: 1.3; }
  .room-meta { grid-column: 2; color: var(--fg-2); font-size: var(--t-sm); }
  .empty { color: var(--fg-2); padding: var(--s-5) 0; }

  /* Vista de subtítulos */
  header.bar { position: sticky; top: 0; z-index: 2; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line); padding: .6rem 1rem; display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; }
  .title { display: flex; align-items: center; gap: .6rem; min-width: 0; flex: 1 1 14rem; }
  .foot .listen[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .foot { flex-wrap: wrap; }
  .foot .status { font-size: .85rem; }
  .title a { text-decoration: none; color: var(--muted); font-size: .95rem; }
  .title strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .langs { display: flex; gap: .35rem; overflow-x: auto; scrollbar-width: none; max-width: 100%; padding: 2px; }
  .langs::-webkit-scrollbar { display: none; }
  .tools { display: flex; gap: .35rem; align-items: center; }

  main.captions { flex: 1; width: 100%; max-width: 52rem; margin: 0 auto; padding: 1.5rem 1rem calc(var(--foot-h, 6rem) + 1.5rem);
    display: flex; flex-direction: column; justify-content: flex-end; }
  /* Las líneas viejas se apagan de a poco; la que se está diciendo lleva la luz de escenario. */
  .cap { font-size: var(--cap-size); line-height: 1.32; margin: 0 0 .55em; color: var(--fg-2); transition: color .4s var(--ease), opacity .4s var(--ease);
    overflow-wrap: anywhere; opacity: .7; }
  .cap.recent { opacity: .9; }
  .cap.last { opacity: 1; color: var(--fg); border-left: 5px solid var(--stage); padding-left: .6em; margin-left: calc(-.6em - 5px); }
  .cap.pending { color: var(--muted); }
  .cap .src { display: block; font-size: .5em; color: var(--muted); margin-top: .15em; }
  .waiting { color: var(--fg-2); font-size: var(--t-lg); max-width: 30rem; }

  .foot { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: center; gap: .5rem;
    padding: .6rem 1rem calc(.6rem + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 40%); pointer-events: none; }
  .foot > * { pointer-events: auto; }
  .status { display: flex; align-items: center; gap: .5rem; color: var(--muted); font-size: .9rem; }
  #jump[hidden] { display: none; }
  details.dl { position: relative; }
  details.dl summary { list-style: none; }
  details.dl summary::-webkit-details-marker { display: none; }
  details.dl .menu { position: absolute; right: 0; bottom: 2.6rem; background: var(--surface); border: 1px solid var(--line); border-radius: .75rem;
    padding: .4rem; display: grid; min-width: 13rem; }
  details.dl .menu a, details.dl .menu .menu-item { padding: .6rem .7rem; min-height: 44px; border-radius: .5rem; text-decoration: none;
    display: flex; align-items: center; text-align: left; background: none; border: 0; cursor: pointer; width: 100%; }
  details.dl .menu a:hover, details.dl .menu .menu-item:hover { background: var(--bg); }
  details.dl .files, details.dl .ui-langs { border-top: 1px solid var(--line); margin-top: .3rem; padding-top: .3rem; }
  details.dl .ui-langs .menu-item[aria-pressed="true"] { font-weight: 700; }
  .foot { gap: .5rem; }
  .foot .tools { margin-left: auto; }
  .foot #jump { position: absolute; bottom: calc(100% + .25rem); left: 50%; transform: translateX(-50%); }
  .recap { position: fixed; left: 0; right: 0; bottom: 3.6rem; z-index: 3; max-width: 52rem; margin: 0 auto;
    max-height: 60vh; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-panel);
    padding: 1rem 1.1rem 1.2rem; box-shadow: var(--shadow-panel); }
  .recap[hidden] { display: none; }
  .recap-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .recap h2 { font-size: 1.2rem; margin: 0; }
  .recap ul { margin: .8rem 0 .6rem; padding-left: 1.2rem; font-size: 1.15rem; line-height: 1.45; }
  .recap li + li { margin-top: .45rem; }
  .recap .meta { color: var(--muted); font-size: .88rem; margin: 0; }
</style>
</head>
<body>
<div id="app"></div>

<template id="t-pick">
  <section class="pick">
    <h1 data-i18n="pick.h1">Elegí la sala</h1>
    <p class="lead" data-i18n="pick.lead">Subtítulos en vivo de cada charla, en el idioma original o traducidos. Funciona en el celular, sin instalar nada.</p>
    <ul class="rooms" data-i18n-attr="aria-label:rooms"></ul>
  </section>
</template>

<template id="t-view">
  <header class="bar">
    <div class="title"><a href="/" data-i18n="rooms" data-i18n-attr="aria-label:rooms.back">Salas</a><strong class="name"></strong></div>
    <div class="langs" role="group" data-i18n-attr="aria-label:langs.label"></div>
  </header>
  <main class="captions">
    <p class="waiting" data-i18n="waiting.start">Esperando que arranque la charla. Los subtítulos aparecen acá apenas alguien habla.</p>
  </main>
  <section class="recap" id="recap-panel" hidden aria-live="polite" aria-labelledby="recap-title">
    <div class="recap-head">
      <h2 id="recap-title" data-i18n="recap.title">Lo último que se dijo</h2>
      <button class="btn" id="recap-close" data-i18n="recap.close" data-i18n-attr="aria-label:recap.close.aria">Cerrar</button>
    </div>
    <div class="recap-body"></div>
  </section>
  <footer class="foot">
    <div class="status" role="status"><span class="dot" id="conn" aria-hidden="true"></span><span id="conn-text" data-i18n="conn.connecting">Conectando</span></div>
    <button class="btn primary listen" id="listen" hidden aria-pressed="false" data-i18n-attr="title:listen.title">Escuchar</button>
    <button class="btn" id="recap" data-i18n="recap.btn">¿Qué me perdí?</button>
    <button class="btn primary" id="jump" hidden data-i18n="jump">Volver al vivo</button>
    <div class="tools">
      <details class="dl">
        <summary class="btn" data-i18n="more">Más</summary>
        <div class="menu">
          <button class="menu-item" data-size="1" data-i18n="size.bigger">Texto más grande</button>
          <button class="menu-item" data-size="-1" data-i18n="size.smaller">Texto más chico</button>
          <button class="menu-item" id="theme">Tema claro</button>
          <button class="menu-item" id="contrast" aria-pressed="false" data-i18n="contrast">Alto contraste</button>
          <div class="ui-langs"></div>
          <div class="files"></div>
        </div>
      </details>
    </div>
  </footer>
</template>

<script src="/web/i18n.js"></script>
<script src="/web/viewer.js"></script>
</body>
</html>
